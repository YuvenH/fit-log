name: 构建并部署到 GitHub Pages

on:
  push:
    branches: [main]
  # 允许在 Actions 页面手动触发一次部署
  workflow_dispatch:

# GITHUB_TOKEN 的最小必要权限：读代码 + 写 Pages + OIDC 身份校验
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，但不取消进行中的任务，避免线上处于半更新状态
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 准备 Node 环境
        uses: actions/setup-node@v7
        with:
          # vite 8 要求 ^20.19.0 || >=22.12.0
          node-version: 22
          cache: npm

      - name: 按 lockfile 精确安装依赖
        run: npm ci

      - name: 构建（prebuild 会重新生成 PWA 图标）
        run: npm run build

      - name: 配置 Pages
        uses: actions/configure-pages@v6

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: 部署
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@v5
